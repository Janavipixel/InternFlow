services:
  - type: web
    name: intern-flow
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FLASK_DEBUG
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AUTOMATION_TOKEN
        sync: false
      - key: EMAIL_ADDRESS
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: RENDER_BACKEND_URL
        value: https://intern-flow-ckh9.onrender.com
