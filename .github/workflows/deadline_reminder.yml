name: Internship Deadline Reminder

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install python-dotenv requests

      - name: Restore database
        env:
          DATABASE_B64: ${{ secrets.DATABASE_B64 }}
        run: |
          echo "$DATABASE_B64" | base64 --decode > internflow.db

      - name: Run deadline automation
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: python automation.py
